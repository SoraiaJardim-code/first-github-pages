<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="Viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Tailwind</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <!--Responsive padding and text-->
    <div class="p-4 lg:p-12">
        <h1 class="texl-2xl lg:text-5xl">
            Title that grows in desktop
        </h1>
     </div>
     <!--Responsive Visibility-->
     <div class="block lg:hidden">Menu Mobile</div>
     <div class="hidden lg:block">Menu Desktop</div>

     <!--Responsive Grid Layout-->
     <div class="grid grid-colors-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
     <div class="bg-gray-800 p-6">Card 1</div>
     <div class="bg-gray-500 p-6">Card 2</div>
     <div class="bg-gray-600 p-6">Card 3</div>
     <div class="bg-gray-500 p-6">Card 4</div>
     <div class="bg-gray-200 p-6">Card 5</div>
     <div class="bg-gray-200 p-6">Card 6</div>
     </div>
    
</body>
</html>
